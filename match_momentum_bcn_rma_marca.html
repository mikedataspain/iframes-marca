<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Momentum · Barcelona 1-2 Real Madrid</title>
<style>
:root{--card:#260a52;--border:#3d1070;--muted:#9966cc;--home:#ff1493;--away:#00e5ff;--text:#fff;--grid:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
body{background:#260a52;font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#card{width:100%;max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--border);padding:clamp(14px,3.4vw,28px) clamp(12px,3.4vw,28px) clamp(10px,2.2vw,16px);overflow:hidden;position:relative}
.kicker{display:flex;justify-content:space-between;gap:8px;font-size:clamp(8.5px,2.1vw,11.5px);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap}
.kicker span{overflow:hidden;text-overflow:ellipsis}
.head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:clamp(6px,2vw,18px);margin:clamp(10px,2.4vw,18px) 0 clamp(10px,2.4vw,16px)}
.team{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1vw,8px);min-width:0}
.team img{height:clamp(42px,12.5vw,86px);width:auto;display:block;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.team-name{font-size:clamp(12px,3.6vw,21px);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;letter-spacing:.01em}
.team-sub{font-size:clamp(9px,2.1vw,12.5px);white-space:nowrap;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.score{text-align:center}
.score-main{font-size:clamp(26px,9.4vw,56px);font-weight:900;white-space:nowrap;line-height:1;letter-spacing:.02em}
.score-main i{font-style:normal;color:var(--muted);padding:0 .08em}
.score-ht{margin-top:6px;font-size:clamp(9px,2.1vw,12.5px);white-space:nowrap;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:clamp(10px,2.4vw,16px)}
.cell{padding:clamp(8px,1.8vw,12px) 2px;text-align:center;border-left:1px solid var(--border);min-width:0;overflow:hidden}
.cell:first-child{border-left:0}
.cell .v{font-size:clamp(10.5px,3.2vw,22px);font-weight:900;white-space:nowrap;line-height:1.1}
.cell .v b{font-weight:900}.cell .v .h{color:var(--home)}.cell .v .a{color:var(--away)}.cell .v u{text-decoration:none;color:var(--muted);padding:0 .12em;font-weight:600}
.cell .l{margin-top:4px;font-size:clamp(7.5px,1.9vw,10.5px);color:#fff;letter-spacing:.1em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px}
.ctitle h2{font-size:clamp(10px,2.4vw,13px);letter-spacing:.14em;text-transform:uppercase;font-weight:800;white-space:nowrap}
.ctitle p{font-size:clamp(8.5px,2vw,11px);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{width:100%;position:relative;touch-action:manipulation}
canvas#momentum{display:block;width:100%}
.goal-hit{position:absolute;cursor:pointer;z-index:3;-webkit-tap-highlight-color:transparent}
.tip{position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .12s;background:rgba(26,6,56,.97);border:1px solid var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.35;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.tip b{display:block;font-size:13px}.tip span{color:#d9c2ff}
.legend{display:flex;justify-content:center;gap:clamp(14px,5vw,34px);margin:6px 0 10px;font-size:clamp(10px,2.4vw,12.5px);font-weight:700;white-space:nowrap}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px clamp(10px,3vw,24px);border-top:1px solid var(--border);padding-top:10px;font-size:clamp(10.5px,2.7vw,13.5px)}
.goals div.col{display:flex;flex-direction:column;gap:5px;min-width:0}
.goals .col.r{align-items:flex-end;text-align:right}
.g{display:flex;align-items:center;gap:7px;white-space:nowrap;max-width:100%}.g .m{margin-top:0}
.g{align-items:flex-start}.g svg{flex:none;margin-top:2px}.g .gt{display:flex;flex-direction:column;min-width:0}.g em{font-style:normal;color:var(--muted);font-size:.86em;line-height:1.25}.g b{font-weight:800;line-height:1.25}.col.r .g .gt{align-items:flex-start;text-align:left}
.g .m{font-weight:900}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:12px;padding-top:9px;border-top:1px solid var(--border);font-size:clamp(9.5px,2.3vw,12px);color:#aaa;white-space:nowrap}
</style></head>

document.addEventListener('touchstart',()=>{hits.forEach(h=>h.el.classList.remove('active'));tip.style.opacity=0});
