<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secuencia del gol · Barcelona 0-1 Real Madrid</title>
<style>
:root{
  --bg:#260a52; --border:#3d1070; --div:#3d1070; --tp:#ffffff; --muted:#9966cc; --foot:#aaaaaa;
  --acc:#ff1493; --goal:#4ae89a; --carry:#c4b5fd; --tint:rgba(74,232,154,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;padding:0;display:flex;justify-content:center;color:var(--tp)}
#card-seq-marca{width:100%;max-width:760px;background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:20px 24px 6px}
.tm{display:flex;align-items:center;gap:12px;min-width:0}
.tm.r{flex-direction:row-reverse;text-align:right}
.crest{width:46px;height:46px;object-fit:contain;flex:none}
.tn{font-size:17px;font-weight:800;color:var(--tp);line-height:1.1;letter-spacing:.2px}
.tr{font-size:10.5px;font-weight:600;color:var(--tp);opacity:.85;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.score{font-size:40px;font-weight:900;color:var(--tp);letter-spacing:1px;line-height:1;white-space:nowrap}
.score i{font-style:normal;color:var(--acc);margin:0 4px}
.sub{padding:0 24px 12px;text-align:center;font-size:11.5px;font-weight:500;color:var(--tp)}
.sub b{color:var(--acc);font-weight:800}
.sttl{padding:10px 24px 0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:1px solid var(--div)}
.sttl .t{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc)}
.sttl .m{font-size:11px;font-weight:600;color:var(--tp)}
.sbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px 24px 0}
.sbar.r2{grid-template-columns:repeat(3,1fr);padding-top:8px}
.sbox{border:1px solid var(--div);border-radius:9px;padding:9px 10px 8px;min-width:0}
.r2 .sbox{background:var(--tint);border-color:var(--goal)}
.sn{font-size:19px;font-weight:900;color:var(--tp);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn.a{color:var(--acc)} .sn.g{color:var(--goal)}
.sn.sm{font-size:14px;padding-top:3px}
.sl{font-size:9px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;color:var(--tp);margin-top:4px;opacity:.9}
.ss{font-size:10px;font-weight:500;color:var(--tp);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwrap{position:relative;padding:12px 24px 0}
canvas{display:block;width:100%}
.tip{position:fixed;pointer-events:none;z-index:9;background:rgba(10,8,24,.96);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 10px;font-size:11.5px;line-height:1.35;max-width:230px;opacity:0;transition:opacity .08s}
.tip .h{font-weight:800;font-size:12.5px;margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 24px 0;font-size:10.5px;font-weight:600;color:var(--tp)}
.lg{display:flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;border:1.5px solid var(--bg)}
.dsh{width:22px;height:0;border-top:2px dashed var(--carry);display:inline-block}
.sol{width:22px;height:0;border-top:2.5px solid var(--acc);display:inline-block}
.order{display:flex;flex-wrap:wrap;gap:4px 10px;padding:10px 24px 0;font-size:10.5px;font-weight:500;color:var(--tp)}
.order span{white-space:nowrap}
.order b{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--acc);color:#fff;font-size:8.5px;font-weight:800;margin-right:4px}
.order span.gl b{background:var(--goal);color:#fff;width:auto;border-radius:8px;padding:0 5px}
.card-footer{padding:12px 24px 13px;margin-top:12px;display:flex;justify-content:space-between;border-top:1px solid var(--div)}
.cf-left{font-size:9px;font-weight:500;letter-spacing:.3px;color:var(--foot)}
.cf-right{font-size:9px;font-weight:600;letter-spacing:.3px;color:var(--foot)}
@media (max-width:560px){
  .hdr{padding:16px 14px 6px;gap:6px}.crest{width:34px;height:34px}.tn{font-size:13px}.score{font-size:30px}
  .tm{gap:8px}.sub,.sttl,.legend,.order{padding-left:14px;padding-right:14px}
  .sbar{padding:10px 14px 0;grid-template-columns:repeat(3,1fr)}.sbar.r2{grid-template-columns:repeat(3,1fr)}
  .cwrap{padding:12px 14px 0}.card-footer{padding-left:14px;padding-right:14px}.sn{font-size:16px}
}
</style>
</head>

  ctx.fillStyle = g; ctx.fillRect(pad.l,pad.t,PW,PH);
  for(let i=0;i<10;i+=2){ctx.fillStyle=TH.stripe; ctx.fillRect(pad.l+i*PW/10,pad.t,PW/10,PH);}
  ctx.strokeStyle = TH.lines; ctx.lineWidth = .9;
  ctx.strokeRect(pad.l,pad.t,PW,PH);
  ctx.beginPath(); ctx.moveTo(FX(50),FY(0)); ctx.lineTo(FX(50),FY(100)); ctx.stroke();
  const cR = Math.max(1,(9.15/105)*PW);
  ctx.beginPath(); ctx.arc(FX(50),FY(50),cR,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(FX(50),FY(50),2,0,Math.PI*2); ctx.fillStyle=TH.lines; ctx.fill();
  // áreas
  const boxes=[[0,16.5,21.1,78.9],[83.5,100,21.1,78.9],[0,5.8,36.8,63.2],[94.2,100,36.8,63.2]];
  boxes.forEach(function(b){ctx.strokeRect(FX(b[0]),FY(b[3]),FX(b[1])-FX(b[0]),FY(b[2])-FY(b[3]));});
  // puntos de penalti
  [[11.5],[88.5]].forEach(function(p){ctx.beginPath();ctx.arc(FX(p[0]),FY(50),1.8,0,Math.PI*2);ctx.fillStyle=TH.lines;ctx.fill();});
  // arcos de área (fuera del área)
  const aR = Math.max(1,(9.15/105)*PW);
  // tramo exterior al área calculado (sin clip: el webview iOS/WebKit ignoraba el recorte y dibujaba el círculo entero)
  const th = Math.acos(Math.min(1,(FX(16.5)-FX(11.5))/aR));
  ctx.beginPath(); ctx.arc(FX(11.5),FY(50),aR,-th,th); ctx.stroke();
  ctx.beginPath(); ctx.arc(FX(88.5),FY(50),aR,Math.PI-th,Math.PI+th); ctx.stroke();
  // porterías
  ctx.strokeStyle = TH.goals; ctx.lineWidth = 1.8;
  const gd = 6;
  ctx.beginPath(); ctx.moveTo(FX(0),FY(55.4)); ctx.lineTo(FX(0)-gd,FY(55.4)); ctx.lineTo(FX(0)-gd,FY(44.6)); ctx.lineTo(FX(0),FY(44.6)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(FX(100),FY(55.4)); ctx.lineTo(FX(100)+gd,FY(55.4)); ctx.lineTo(FX(100)+gd,FY(44.6)); ctx.lineTo(FX(100),FY(44.6)); ctx.stroke();
}
function arrow(x1,y1,x2,y2,r1,r2,o){
  // línea (con curvatura opcional) acortada en ambos extremos + punta
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, ux=dx/L, uy=dy/L;
  const bend = (o.bend||0)*L, nx=-uy, ny=ux;
  const cx=(x1+x2)/2+nx*bend, cy=(y1+y2)/2+ny*bend;
  // tangentes
  let t0x=cx-x1,t0y=cy-y1,l0=Math.hypot(t0x,t0y)||1; t0x/=l0;t0y/=l0;
  let t1x=x2-cx,t1y=y2-cy,l1=Math.hypot(t1x,t1y)||1; t1x/=l1;t1y/=l1;
  const sx=x1+t0x*r1, sy=y1+t0y*r1, ex=x2-t1x*(r2+(o.gap||2)), ey=y2-t1y*(r2+(o.gap||2));
  ctx.save();
  ctx.strokeStyle=o.color; ctx.fillStyle=o.color; ctx.lineWidth=o.w; ctx.lineCap='round';
  ctx.globalAlpha=o.alpha||1;
  if(o.dash) ctx.setLineDash(o.dash);
  if(o.glow){ctx.shadowColor=o.color; ctx.shadowBlur=10;}
  ctx.beginPath(); ctx.moveTo(sx,sy);
  if(o.bend) ctx.quadraticCurveTo(cx,cy,ex-t1x*(o.head||8)*.6,ey-t1y*(o.head||8)*.6); else ctx.lineTo(ex-t1x*(o.head||8)*.6,ey-t1y*(o.head||8)*.6);
  ctx.stroke(); ctx.setLineDash([]); ctx.shadowBlur=0;
  const hs=o.head||8, ang=Math.atan2(t1y,t1x);
  ctx.beginPath(); ctx.moveTo(ex,ey);
  ctx.lineTo(ex-hs*Math.cos(ang-.42),ey-hs*Math.sin(ang-.42));
  ctx.lineTo(ex-hs*Math.cos(ang+.42),ey-hs*Math.sin(ang+.42));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function node(e){
  const x=FX(e.x), y=FY(e.y), isShot=(e.kind==='goal'||e.kind==='shot');
  const r = e.kind==='goal'?10 : e.kind==='shot'?10 : e.kind==='pass'?8 : 4.5;
  const col = e.kind==='goal'?TH.goal : e.kind==='carry'?TH.carry : TH.acc;
  if(isShot){ // glow
    const gr=ctx.createRadialGradient(x,y,r*.4,x,y,r*2.8); gr.addColorStop(0,col+'88'); gr.addColorStop(1,col+'00');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,y,r*2.8,0,Math.PI*2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(x,y,Math.max(1,r),0,Math.PI*2);
  ctx.fillStyle = col; ctx.fill();
  ctx.lineWidth=1.6; ctx.strokeStyle=TH.nodeStroke; ctx.stroke();
  if(e.num!==null || isShot){
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    if(isShot){ ctx.font='13px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.fillText(e.kind==='goal'?'⚽':'◎',x,y+.5); }
    else { ctx.font='800 9.5px Inter,"Segoe UI",system-ui,sans-serif'; ctx.fillText(String(e.num),x,y+.5); }
  }
  hits.push({x:x,y:y,r:Math.max(r,9),e:e});
}
const params = new URLSearchParams(window.location.search);
const INSTANT = params.get('instant') === '1';
let currentReveal = INSTANT ? SEQ.length : 0;
let tooltipsEnabled = INSTANT;
let animationStarted = false;
function computeDurationMs(total){ return Math.min(10000, Math.round((4000 + Math.min(total / 110, 1) * 6000) * 1.5)); }
function drawSequence(rc){
  hits=[];
  for(let i=0;i<rc-1;i++){
    const a=SEQ[i], b=SEQ[i+1];
    const ra = a.kind==='pass'?8:4.5, rb = b.kind==='pass'?8:(b.kind==='carry'?4.5:10);
    if(a.kind==='carry'){
      arrow(FX(a.x),FY(a.y),FX(b.x),FY(b.y),ra,rb,{color:TH.carry,w:2,dash:[6,4],alpha:.95,head:7,gap:2});
    } else {
      arrow(FX(a.x),FY(a.y),FX(b.x),FY(b.y),ra,rb,{color:TH.acc,w:2,alpha:.85,bend:.05,head:8,gap:1});
    }
  }
  if(rc>=SEQ.length){ // flecha del tiro solo al completar la secuencia
    const f=SEQ[SEQ.length-1];
    arrow(FX(f.x),FY(f.y),FX(META.tx),FY(META.ty),10,0,{color:TH.goal,w:2.8,head:10,glow:true,gap:0});
  }
  for(let i=0;i<rc;i++) node(SEQ[i]);
}
function draw(){ layout(); drawPitch(); drawSequence(currentReveal); }
function startAnimation(){
  if (animationStarted || INSTANT) return;
  animationStarted = true; tooltipsEnabled = false;
  const total = SEQ.length, stepMs = computeDurationMs(total) / total;
  let i = 0;
  function tick(){
    i++; currentReveal = i; draw();
    if (i < total) setTimeout(tick, stepMs); else { tooltipsEnabled = true; notifyHeight(); }
  }
  tick();
}
cv.addEventListener('mousemove',function(ev){
  if(!tooltipsEnabled){tip.style.opacity=0;return;}
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  let h=null; for(let i=hits.length-1;i>=0;i--){const k=hits[i]; if(Math.hypot(mx-k.x,my-k.y)<=k.r){h=k;break;}}
  if(!h){tip.style.opacity=0;return;}
  tip.innerHTML='<div class="h">'+h.e.title+'</div>'+h.e.detail;
  tip.style.left=Math.min(ev.clientX+14,window.innerWidth-240)+'px'; tip.style.top=(ev.clientY+14)+'px'; tip.style.opacity=1;
});
cv.addEventListener('mouseleave',function(){tip.style.opacity=0});
cv.addEventListener('touchstart',function(ev){const t=ev.touches[0]; cv.dispatchEvent(new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY}));},{passive:true});
function notifyHeight(){try{
  if(parent===window)return;
  const c=document.getElementById('card-seq-marca').getBoundingClientRect(), bs=getComputedStyle(document.body);
  const h=Math.ceil(c.bottom+window.scrollY+(parseFloat(bs.paddingBottom)||0)+(parseFloat(bs.marginBottom)||0)); // altura real de la card, no scrollHeight
  parent.postMessage({type:'campograma-resize',id:'seq-anim-bcn-rma',height:h},'*');
  parent.postMessage({sentinel:'amp',type:'embed-size',height:h},'*');
  parent.postMessage({mmResize:true,height:h},'*');
}catch(e){}}
function render(){draw(); notifyHeight();}
window.addEventListener('resize',render);
render();
if(INSTANT){ /* estado final directo, sin animación */ }
else if('IntersectionObserver' in window){
  const io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){startAnimation();io.disconnect();}})},{threshold:0.35});
  io.observe(document.getElementById('card-seq-marca'));
} else { startAnimation(); }
</script>
