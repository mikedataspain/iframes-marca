<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secuencia del gol Atlético · Espanyol 0-1 Atlético (dark)</title>
<style>
:root{
  --bg:#0d0d1a; --bd:#181830; --ink:#ffffff; --lab:#cccccc; --foot:#aaaaaa; --div:#141428;
  --acc:#e8374e; --goal:#4ae89a; --assist:#b8930a; --carry:#a78bfa;
  --pitchbg:#0d1120; --goalrgb:74,232,154; --body:#06060d; --tt:#16162b; --ttink:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);padding:0;-webkit-font-smoothing:antialiased}
body.png{background:transparent;padding:0}
.card{width:100%;max-width:760px;margin:0 auto;background:var(--bg);border:1px solid var(--bd);border-radius:14px;overflow:hidden;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;padding:18px 24px 16px;border-bottom:1px solid var(--div)}
.hl{display:flex;align-items:center;gap:14px;min-width:0}
.crest{height:44px;width:auto;display:block;flex:none}
.tn{font-size:22px;font-weight:800;color:var(--acc);letter-spacing:-.2px;line-height:1.1}
.ts{font-size:13px;font-weight:500;color:var(--ink);margin-top:3px}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.score{display:flex;align-items:center;gap:12px}
.score img{height:30px;width:auto;display:block}
.score span{font-size:30px;font-weight:800;color:var(--ink);letter-spacing:1px;line-height:1;font-variant-numeric:tabular-nums}
.mi{font-size:12px;font-weight:500;color:var(--ink);text-align:right}
.sbar{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--div)}
.sbar.r2{grid-template-columns:repeat(3,1fr);background:rgba(var(--goalrgb),.09)}
.sbox{padding:13px 8px 12px;text-align:center;border-right:1px solid var(--div);min-width:0}
.sbox:last-child{border-right:0}
.sn{font-size:23px;font-weight:800;line-height:1.1;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar.r2 .sn{font-size:19px}
.sl{font-size:10px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--lab);margin-top:5px}
.cwrap{position:relative;background:var(--pitchbg)}
canvas{display:block;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:12px 24px;border-top:1px solid var(--div);font-size:12.5px;font-weight:500;color:var(--ink)}
.lg{display:flex;align-items:center;gap:8px}
.ln{width:26px;height:0;border-top:3px solid var(--acc);border-radius:2px}
.ln.dash{border-top:3px dashed var(--carry)}
.dot{width:13px;height:13px;border-radius:50%;border:2.5px solid var(--carry);background:rgba(167,139,250,.25)}
.dot.g{border-color:var(--goal);background:rgba(var(--goalrgb),.25);width:15px;height:15px}
.card-footer{padding:7px 24px 13px;display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--div)}
.cf-left{font-size:9px;font-weight:500;letter-spacing:.3px;color:var(--foot)}
.cf-right{font-size:9px;font-weight:600;letter-spacing:.3px;color:var(--foot)}
.tt{position:absolute;z-index:5;pointer-events:none;background:var(--tt);color:var(--ttink);border:1px solid var(--bd);border-radius:9px;padding:8px 11px;font-size:12px;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .08s;max-width:230px}
.tt.on{opacity:1}
.tt b{display:block;font-size:13px;font-weight:800;margin-bottom:2px}
.tt i{font-style:normal;opacity:.85}
@media (max-width:560px){
  .hdr{padding:14px 16px 12px}
  .tn{font-size:18px}.crest{height:36px}
  .hr{align-items:flex-start}.mi{text-align:left}
  .sbar{grid-template-columns:repeat(3,1fr)}
  .sbar .sbox:nth-child(3){border-right:0}
  .sbar .sbox:nth-child(n+4){border-top:1px solid var(--div)}
  .sn{font-size:19px}.sbar.r2 .sn{font-size:16px}
  .legend{padding:10px 16px;gap:6px 16px}.card-footer{padding:7px 16px 12px}
}
</style>
</head>

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
const X = ox => pad.l + ox / 100 * PW;
const Y = oy => pad.t + (100 - oy) / 100 * PH;

function drawPitch() {
  ctx.fillStyle = T.canvas; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(pad.l, 0, pad.l + PW, 0);
  T.grad.forEach((c, i) => g.addColorStop(i / (T.grad.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(pad.l, pad.t, PW, PH);
  const ns = 14, sw = PW / ns;
  ctx.fillStyle = T.stripe;
  for (let i = 0; i < ns; i += 2) ctx.fillRect(pad.l + i * sw, pad.t, sw, PH);
  ctx.lineWidth = 1.1; ctx.strokeStyle = T.lines; ctx.lineJoin = 'round';
  ctx.strokeRect(pad.l, pad.t, PW, PH);
  const mx = (m) => m * sc, cy = pad.t + PH / 2;
  // línea de medio + círculo central
  ctx.beginPath(); ctx.moveTo(pad.l + PW / 2, pad.t); ctx.lineTo(pad.l + PW / 2, pad.t + PH); ctx.stroke();
  ctx.beginPath(); ctx.arc(pad.l + PW / 2, cy, Math.max(1, mx(9.15)), 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = T.lines; ctx.beginPath(); ctx.arc(pad.l + PW / 2, cy, Math.max(1, 1.8), 0, Math.PI * 2); ctx.fill();
  [0, 1].forEach(side => {
    const dir = side ? -1 : 1, x0 = side ? pad.l + PW : pad.l;
    ctx.strokeRect(side ? x0 - mx(16.5) : x0, cy - mx(20.16), mx(16.5), mx(40.32));      // área grande
    ctx.strokeRect(side ? x0 - mx(5.5) : x0, cy - mx(9.16), mx(5.5), mx(18.32));        // área pequeña
    ctx.beginPath(); ctx.arc(x0 + dir * mx(11), cy, Math.max(1, 1.8), 0, Math.PI * 2); ctx.fill(); // punto de penalti
    // arco del área: sólo la parte exterior al área
    ctx.save(); ctx.beginPath();
    if (side) ctx.rect(pad.l, pad.t, PW - mx(16.5), PH); else ctx.rect(pad.l + mx(16.5), pad.t, PW - mx(16.5), PH);
    ctx.clip(); ctx.beginPath(); ctx.arc(x0 + dir * mx(11), cy, Math.max(1, mx(9.15)), 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    // portería
    ctx.save(); ctx.strokeStyle = T.goals; ctx.lineWidth = 1.8;
    ctx.strokeRect(side ? x0 : x0 - mx(2.44), cy - mx(3.66), mx(2.44), mx(7.32)); ctx.restore();
  });
}

function arrowHead(x, y, ang, size, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = color;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-size, -size * .5); ctx.lineTo(-size * .78, 0); ctx.lineTo(-size, size * .5); ctx.closePath(); ctx.fill(); ctx.restore();
}
function arrow(x1, y1, x2, y2, color, lw, a0) {
  const g = ctx.createLinearGradient(x1, y1, x2, y2);
  g.addColorStop(0, rgba(color, a0)); g.addColorStop(1, rgba(color, 1));
  const ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.strokeStyle = g; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 - Math.cos(ang) * 4, y2 - Math.sin(ang) * 4); ctx.stroke();
  arrowHead(x2, y2, ang, 8, color);
}

const NR = { pass: 8, assist: 8, dribble: 5, goal: 10 };
function colorOf(n) { return n.kind === 'goal' ? T.goal : n.kind === 'assist' ? T.assist : n.kind === 'dribble' ? T.carry : T.acc; }

function drawNode(n) {
  const x = X(n.x), y = Y(n.y), r = NR[n.kind], c = colorOf(n);
  const gl = ctx.createRadialGradient(x, y, r * .5, x, y, r * 2.8);
  gl.addColorStop(0, rgba(c, n.kind === 'dribble' ? .22 : .38)); gl.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(x, y, r * 2.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, y, Math.max(1, r), 0, Math.PI * 2);
  ctx.fillStyle = T.nodeFill ? T.nodeFill(c, n.kind) : rgba(c, .3); ctx.fill();
  ctx.lineWidth = n.kind === 'goal' ? 2.4 : 2; ctx.strokeStyle = c; ctx.stroke();
  const isShot = n.kind === 'goal';
  if (n.n !== null || isShot) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (isShot) { ctx.font = '13px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('⚽', x, y + 1); }
    else { ctx.font = '700 10px Inter,"Segoe UI",system-ui,sans-serif'; ctx.fillStyle = T.num; ctx.fillText(String(n.n), x, y + .5); }
  }
}

function render() {
  layout(); drawPitch(); HIT = [];
  const N = D.nodes, px = n => [X(n.x), Y(n.y)];
  // 1) conducciones (discontinua violeta)
  ctx.save(); ctx.setLineDash([6, 5]); ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = T.carry;
  D.carries.forEach(c => { ctx.beginPath(); ctx.moveTo(X(c.x1), Y(c.y1)); ctx.lineTo(X(c.x2), Y(c.y2)); ctx.stroke();
    HIT.push({ seg: [X(c.x1), Y(c.y1), X(c.x2), Y(c.y2)], c: T.carry, h: `<b style="color:${T.carry}">Conducción</b>${c.player}<br><i>${String(c.d).replace('.', ',')} m · ${c.t}</i>` }); });
  ctx.restore();
  // 2) flechas de pase (el asistente se pinta encima) + tiro final
  const order = N.map((n, i) => i).filter(i => N[i].kind === 'pass').concat(N.map((n, i) => i).filter(i => N[i].kind === 'assist'));
  order.forEach(i => {
    const n = N[i], nx = N[i + 1], [x1, y1] = px(n); let x2 = X(n.ex), y2 = Y(n.ey);
    if (nx) { const [nx_, ny_] = px(nx); if (Math.hypot(x2 - nx_, y2 - ny_) < 26) {   // la punta se apoya en el borde del siguiente nodo
      const a = Math.atan2(ny_ - y1, nx_ - x1), rr = NR[nx.kind] + 2; x2 = nx_ - Math.cos(a) * rr; y2 = ny_ - Math.sin(a) * rr; } }
    arrow(x1, y1, x2, y2, colorOf(n), n.kind === 'assist' ? 2.6 : 2.2, .42);
  });
  const G = N[N.length - 1], [gx, gy] = px(G);
  { const tx = X(G.ex), ty = Y(G.ey); arrow(gx, gy, tx, ty, T.goal, 2.8, .55); }
  // 3) nodos
  N.filter(n => n.kind === 'pass' || n.kind === 'dribble' || n.kind === 'assist').forEach(drawNode); drawNode(G);
  N.forEach(n => {
    const [x, y] = px(n); let h;
    const nm = n.player.replace('J. Alvarez', 'J. Álvarez');
    if (n.kind === 'goal') h = `<b style="color:${T.goal}">Gol · ${nm}</b>${S.foot} · ${S.dist} m<br><i>Min ${n.t} · destino ${S.dest}</i>`;
    else if (n.kind === 'dribble') h = `<b style="color:${T.carry}">Regate · ${nm}</b><i>Min ${n.t}</i>`;
    else h = `<b style="color:${colorOf(n)}">${n.kind === 'assist' ? 'Asistencia' : 'Pase ' + n.n} · ${nm}</b>${String(n.len).replace('.', ',')} m${n.long ? ' · balón largo' : ''}<br><i>Min ${n.t}</i>`;
    HIT.push({ x, y, r: NR[n.kind] + 5, h, c: colorOf(n) });
  });
  if (parent !== window) { const c = document.querySelector('.card').getBoundingClientRect(), bs = getComputedStyle(document.body), h = Math.ceil(c.bottom + window.scrollY + (parseFloat(bs.paddingBottom) || 0) + (parseFloat(bs.marginBottom) || 0)); parent.postMessage({ campograma: 'resize', height: h }, '*'); parent.postMessage({ sentinel: 'amp', type: 'embed-size', height: h }, '*'); parent.postMessage({ mmResize: true, height: h }, '*'); }
}

/* ---------- tooltip (ratón + táctil) ---------- */
function segDist(px_, py_, s) { const [x1, y1, x2, y2] = s, dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  let t = Math.max(0, Math.min(1, ((px_ - x1) * dx + (py_ - y1) * dy) / l2)); return Math.hypot(px_ - (x1 + t * dx), py_ - (y1 + t * dy)); }
function pick(mx, my) {
  let hit = HIT.find(h => h.r && Math.hypot(mx - h.x, my - h.y) <= h.r);
  if (!hit) hit = HIT.find(h => h.seg && segDist(mx, my, h.seg) <= 6);
  return hit;
}
function show(e) {
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, hit = pick(mx, my);
  if (!hit) { tt.classList.remove('on'); return; }
  tt.innerHTML = hit.h; tt.classList.add('on');
  let lx = mx + 14, ly = my + 14; if (lx + tt.offsetWidth > W - 4) lx = mx - tt.offsetWidth - 14; if (ly + tt.offsetHeight > H - 4) ly = my - tt.offsetHeight - 14;
  tt.style.left = Math.max(4, lx) + 'px'; tt.style.top = Math.max(4, ly) + 'px';
}
cv.addEventListener('pointermove', show); cv.addEventListener('pointerdown', show);
cv.addEventListener('pointerleave', () => tt.classList.remove('on'));
document.addEventListener('pointerdown', e => { if (e.target !== cv) tt.classList.remove('on'); });

(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(render);
window.addEventListener('resize', render);
if (window.ResizeObserver) new ResizeObserver(() => { if (Math.floor(cw.clientWidth) !== W + 0 && cw.clientWidth) render(); }).observe(cw);
</script>
