<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de pases · Rodri y Pedri · Barcelona 1-2 Real Madrid</title>
<style>
:root{--card:#260a52;--border:#3d1070;--muted:#9966cc;--c1:#00e5ff;--c2:#ff1493;--gold:#ffdd00;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%}
body{background:#260a52;font-family:'Segoe UI',Inter,system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#card{width:100%;max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--border);overflow:hidden;position:relative}
.hdr{border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:clamp(12px,3vw,22px) clamp(12px,3.2vw,26px)}
.who{display:flex;align-items:center;gap:clamp(8px,2.2vw,16px);min-width:0}
.who img{height:clamp(34px,8.6vw,56px);width:auto;display:block;filter:drop-shadow(0 3px 10px rgba(0,0,0,.4));flex:none}
.who img+img{margin-left:-4px}
.pname{font-size:clamp(17px,4.9vw,29px);font-weight:900;white-space:nowrap;line-height:1.1;letter-spacing:.005em}
.psub{margin-top:3px;font-size:clamp(8.5px,2.1vw,12.5px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;white-space:nowrap;color:#c4a0ff}
.meta{text-align:right;min-width:0}
.m1{font-size:clamp(8.5px,2vw,12px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted);white-space:nowrap}
.m2{margin-top:3px;font-size:clamp(9px,2.1vw,12.5px);white-space:nowrap;color:#fff}
.stats{display:grid;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cell{padding:clamp(9px,2vw,14px) 4px;text-align:center;border-left:1px solid var(--border);min-width:0;overflow:hidden}
.cell:first-child{border-left:0}
.cell .v{font-size:clamp(17px,5.2vw,32px);font-weight:900;white-space:nowrap;line-height:1.05}
.cell .l{margin-top:4px;font-size:clamp(7.5px,1.9vw,10.5px);color:#fff;letter-spacing:.12em;text-transform:uppercase;font-weight:700;white-space:nowrap}
.cell .s{margin-top:2px;font-size:clamp(8.5px,2vw,11.5px);color:#c4a0ff;white-space:nowrap}
.panel{padding:clamp(8px,2vw,16px) clamp(8px,2vw,16px) 0}
.canvas-wrap{width:100%;position:relative;touch-action:manipulation;border-radius:6px;overflow:hidden}
canvas.pitch{display:block;width:100%}
.tip{position:absolute;z-index:5;pointer-events:none;opacity:0;transition:opacity .1s;background:rgba(26,6,56,.97);border:1px solid var(--muted);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.4;white-space:normal;max-width:calc(100% - 8px);box-shadow:0 6px 20px rgba(0,0,0,.45)}
.tip b{display:block;font-size:13px}.tip span{display:block;color:#d9c2ff}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px clamp(12px,3vw,22px);padding:clamp(9px,2vw,13px) clamp(12px,3.2vw,26px);border-top:1px solid var(--border);margin-top:clamp(8px,2vw,14px);font-size:clamp(10px,2.4vw,12.5px);font-weight:700}
.legend .lt{font-size:clamp(8.5px,2vw,11px);letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:700}
.legend span.it{display:inline-flex;align-items:center;gap:7px}
@media(max-width:520px){.meta{text-align:left;width:100%}}
.legend svg{flex:none}
.foot{display:flex;justify-content:space-between;gap:8px;padding:2px clamp(12px,3.2vw,26px) clamp(10px,2.2vw,16px);font-size:clamp(9px,2.2vw,11.5px);color:#aaa;white-space:nowrap}
.foot span:last-child{font-weight:600}

.pgrid{display:grid;grid-template-columns:1fr;gap:clamp(10px,2.4vw,16px);padding:clamp(10px,2.4vw,16px) clamp(8px,2vw,16px) 0}
#card{max-width:720px}
.pblock{min-width:0;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:rgba(26,6,56,.35)}
.pstrip{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:9px 12px 8px}
.pstrip b{font-size:clamp(14px,3.6vw,18px);font-weight:900;white-space:nowrap}
.pstrip span{font-size:clamp(9px,2.1vw,11.5px);color:#c4a0ff;white-space:nowrap;letter-spacing:.04em}
.pstrip span em{font-style:normal;color:#fff;font-weight:800}
.pblock .stats{grid-template-columns:repeat(5,1fr)}
.pblock .cell{padding:8px 1px}
.pblock .cell .v{font-size:clamp(13px,3.4vw,19px)}
.pblock .cell .l{font-size:clamp(6.5px,1.7vw,8.5px);letter-spacing:.06em}
.pblock .canvas-wrap{border-radius:0}
.legend svg{overflow:visible}
</style></head>

  B.tip.innerHTML=`<b style="color:#fff">${B.p.name} · ${a.clock}</b>${st}<span>${a.len} m de longitud</span>`;

  const tw=B.tip.offsetWidth,th=B.tip.offsetHeight,W=B.wrap.clientWidth,mx=(a.sx+a.ex)/2,my=(a.sy+a.ey)/2;
  let l=Math.max(4,Math.min(mx-tw/2,W-tw-4)),t=Math.min(a.sy,a.ey)-th-10;if(t<4)t=Math.max(a.sy,a.ey)+10;
  B.tip.style.left=l+'px';B.tip.style.top=t+'px';drawBlock(B);
}
function hideTip(B){if(B.hover<0&&B.tip.style.opacity==0)return;B.hover=-1;B.tip.style.opacity=0;drawBlock(B)}
blocks.forEach(B=>{
  const loc=(cx,cy)=>{const r=B.cv.getBoundingClientRect();return[cx-r.left,cy-r.top]};
  B.cv.addEventListener('mousemove',e=>{const[px,py]=loc(e.clientX,e.clientY),i=pick(B,px,py,6);if(i!==B.hover)i<0?hideTip(B):showTip(B,i)});
  B.cv.addEventListener('mouseleave',()=>hideTip(B));
  B.cv.addEventListener('touchstart',e=>{e.stopPropagation();const t=e.touches[0],[px,py]=loc(t.clientX,t.clientY),i=pick(B,px,py,14);
    blocks.forEach(o=>{if(o!==B&&o.hover>=0)hideTip(o)});
    if(i>=0){e.preventDefault();i===B.hover?hideTip(B):showTip(B,i)}else hideTip(B)},{passive:false});
});
document.addEventListener('touchstart',()=>blocks.forEach(hideTip));
function render(){blocks.forEach(drawBlock);reportHeight()}
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,120)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
render();
</script>
</body></html>
